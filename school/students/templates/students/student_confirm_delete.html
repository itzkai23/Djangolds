{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <!-- Card to hold the delete confirmation -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-2 p-4 text-center">
                <h2 class="fw-bold text-dark mb-4">
                    Are you sure you want to delete "{{ student.first_name }} {{ student.last_name }}"?
                </h2>
                <p class="text-muted mb-4">This action is permanent and cannot be undone.</p>
                
                <!-- Delete Confirmation Form -->
                <form method="post" class="mb-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg w-100">
                        Yes, Delete
                    </button>                    
                </form>
                
                <!-- Cancel Link -->
                <a href="{% url 'student_list' %}" class="btn btn-warning btn-lg w-100">
                    Cancel
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
